[package]
name = "armssim"
version = "0.1.0"
edition = "2021"
description = "Arms-warrior gear optimizer driving the WoWSims TBC engine"

[lib]
name = "armssim"
path = "src/lib.rs"

[[bin]]
name = "armssim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
